name: CI

# Single source of truth for "is this commit good?".
#
# Before this workflow there were four overlapping pipelines and the PR gate
# (`pr.yml`) ran `pnpm test`, which:
#   • chained 48 of the 66 test files with `&&` (adding a file meant nobody ran it);
#   • never ran typecheck, lint or build — a PR could merge with TS errors;
#   • never type-checked the Edge Functions at all (no Deno step existed).
# Everything below fails the PR. Nothing is skipped silently: when a tool is
# missing the script says so and exits non-zero.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_AUDIT: 'false'

jobs:
  workspace:
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile

      - name: Typecheck — packages
        run: corepack pnpm run typecheck:packages
      - name: Typecheck — elder app
        run: corepack pnpm run typecheck:elder
      - name: Typecheck — grandchild app
        run: corepack pnpm run typecheck:grandchild
      - name: Typecheck — family app
        run: corepack pnpm run typecheck:family
      - name: Typecheck — carer app
        run: corepack pnpm run typecheck:carer

      - name: Lint (zero warnings)
        run: corepack pnpm run lint

      - name: Build — family dashboard
        run: corepack pnpm run build:family

  edge-functions:
    name: edge typecheck · contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile

      - name: Typecheck every Supabase Edge Function (deno check)
        run: ./scripts/ci/verify-edge-functions.sh

      - name: Edge Function contract tests
        run: corepack pnpm run test:edge

      # Half the edge suite still asserts on source text; this keeps that number
      # from growing and fails when an allowlisted file is converted without the
      # entry being removed.
      - name: Test-substance audit
        run: corepack pnpm run audit:tests

      - name: Every function is rate-limited or exempt
        run: corepack pnpm run audit:functions

  sql:
    name: migrations · RLS coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pglast==8.7

      - name: Parse every migration (SQL + plpgsql) and audit RLS coverage
        run: ./scripts/ci/verify-sql.sh

      - name: Documentation claims match the repository
        run: corepack pnpm run audit:docs

  database:
    name: migrations on a real Postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile

      # Applies every migration from scratch in order. This is where a forward
      # reference or a missing DOWN object actually surfaces.
      #
      # This job failed on every commit from ec0ca40 until now, and the failure was
      # undiagnosable: the two commands shared one step, so the output said which
      # exit code failed but not which command, and nothing was kept once the run
      # aged out. Split into named steps, capture the CLI's own logs, and upload
      # them on failure so the next red run can be read.
      - name: Start the local Supabase stack
        run: supabase start

      - name: Apply every migration from scratch
        run: supabase db reset --debug

      - name: Diagnose the failed stack
        if: failure()
        run: |
          {
            echo '::group::supabase status'
            supabase status || true
            echo '::endgroup::'
            echo '::group::containers'
            docker ps -a || true
            echo '::endgroup::'
            echo '::group::container logs'
            for container in $(docker ps -aq --filter 'name=supabase' || true); do
              echo "── $container"
              docker logs "$container" 2>&1 | tail -200 || true
            done
            echo '::endgroup::'
          } | tee /tmp/supabase-diagnostics.log
          # PostgreSQL logs are written into the volume, not stdout.
          mkdir -p /tmp/supabase-logs
          docker cp "$(docker ps -aq --filter 'name=supabase_db_' | head -1):/var/log/postgresql" /tmp/supabase-logs/ 2>/dev/null || true

      - name: Upload the diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-failure-diagnostics
          path: |
            /tmp/supabase-diagnostics.log
            /tmp/supabase-logs/**
            supabase/.temp/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Live RLS integration tests
        run: corepack pnpm run test:supabase:local

  summary:
    name: summary
    runs-on: ubuntu-latest
    needs: [workspace, edge-functions, sql, database]
    if: always()
    steps:
      - name: Report
        run: |
          {
            echo "### CI results"
            echo ""
            echo "| job | result |"
            echo "| --- | --- |"
            echo "| workspace (typecheck · lint · build) | ${{ needs.workspace.result }} |"
            echo "| edge-functions (deno check · tests) | ${{ needs.edge-functions.result }} |"
            echo "| sql (migrations · RLS) | ${{ needs.sql.result }} |"
            echo "| database (live migrations) | ${{ needs.database.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
